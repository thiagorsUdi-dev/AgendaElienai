<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3E4D3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Agenda · Per amiche di Elienai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3E4D3; --navy-0:#0d1020; --navy-1:#161b2e; --navy-2:#232944; --navy-3:#2f3657;
  --paper:#fffdf9; --paper-2:#f6efe2; --paper-3:#ece2cf;
  --gold:#c9a36b; --gold-d:#9a7240; --gold-dd:#6f4f24; --gold-l:#ead6ad;
  --beige:#e7dec9; --beige-d:#cfc3a8;
  --ink:#1b1b22; --ink-2:#4a4750; --wine:#a24a4a;
  --script:'Great Vibes','Brush Script MT',cursive;
  --hand:'Dancing Script','Segoe Script',cursive;
  --note:'Caveat','Segoe Print',cursive;
  --serif:'Cormorant Garamond',Georgia,serif;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:var(--ui);color:var(--ink);overflow-x:hidden;
  background:#F3E4D3;
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ambient leaves */
.amb{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.amb svg{position:absolute;color:var(--navy-1);opacity:.09;animation:drift 22s ease-in-out infinite}
.amb svg:nth-child(1){left:4%;top:18%;width:90px}
.amb svg:nth-child(2){left:88%;top:12%;width:130px;animation-delay:-6s}
.amb svg:nth-child(3){left:12%;top:72%;width:150px;animation-delay:-11s}
.amb svg:nth-child(4){left:80%;top:68%;width:80px;animation-delay:-3s}
.amb svg:nth-child(5){left:50%;top:4%;width:60px;animation-delay:-15s}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(18px,-26px) rotate(10deg)}}

/* top bar */
.app{position:relative;z-index:1;padding:18px clamp(12px,3vw,40px) 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;max-width:1280px;margin:0 auto 14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .mark{width:68px;height:68px;border-radius:16px;object-fit:cover;display:block;box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 0 2px rgba(234,214,173,.55)}
.brand h1{font-family:var(--serif);font-style:italic;font-size:1.55rem;color:var(--navy-1);line-height:1}
.brand small{display:block;font-size:.62rem;letter-spacing:.28em;color:var(--navy-2);margin-top:5px;text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.glass{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;
  background:linear-gradient(180deg,var(--gold-l),var(--gold) 70%,#b88d52);border:1px solid rgba(111,79,36,.35);color:#4b3715;font-size:.85rem;font-weight:600;letter-spacing:.01em;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 8px 18px rgba(111,79,36,.28),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .18s,box-shadow .18s,background .2s,border-color .2s}
.glass:hover{transform:translateY(-2px);filter:brightness(1.06);border-color:rgba(111,79,36,.6);box-shadow:0 12px 24px rgba(111,79,36,.35),0 0 0 4px rgba(201,163,107,.2),inset 0 1px 0 rgba(255,255,255,.65)}
.glass:active{transform:translateY(0) scale(.97)}
.glass:focus-visible,.btn-gold:focus-visible,.segmented button:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
.glass svg{width:18px;height:18px}
.glass.icon{width:42px;padding:0;justify-content:center}
input.glass{color-scheme:light;font-family:var(--ui);padding:0 14px}
.segmented{display:inline-flex;padding:4px;gap:2px;border-radius:999px;background:rgba(201,163,107,.45);border:1px solid rgba(111,79,36,.3);box-shadow:inset 0 2px 6px rgba(111,79,36,.3)}
.segmented button{border:0;background:none;color:#4b3715;padding:8px 16px;border-radius:999px;font-size:.82rem;font-weight:600;transition:all .22s}
.segmented button:hover{color:#2c1f0c}
.segmented button[aria-pressed=true]{background:linear-gradient(135deg,#fffdf9,var(--paper-2));color:var(--gold-dd);box-shadow:0 4px 14px rgba(201,163,107,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-gold{height:44px;padding:0 22px;border:0;border-radius:999px;font-weight:700;font-size:.9rem;color:#2c1f0c;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--gold-l),var(--gold) 55%,#b88d52);
  box-shadow:0 10px 26px rgba(201,163,107,.42),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(111,79,36,.3);transition:transform .18s,box-shadow .18s}
.btn-gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.top .btn-gold{background:linear-gradient(135deg,#fffaf0,var(--gold-l) 60%,#e3c98e);box-shadow:0 10px 24px rgba(60,40,0,.35),inset 0 1px 0 #fff,inset 0 -3px 0 rgba(111,79,36,.25)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(201,163,107,.55),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(111,79,36,.3)}
.btn-gold:hover::after{transform:translateX(120%)}
.btn-gold:active{transform:translateY(0) scale(.97)}
.btn-gold svg{width:18px;height:18px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:48px;min-width:230px;z-index:30;padding:6px;border-radius:14px;
  background:var(--navy-2);border:1px solid rgba(234,214,173,.3);box-shadow:0 20px 40px rgba(0,0,0,.55);
  animation:rise .18s ease-out}
.menu[hidden]{display:none}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;color:var(--gold-l);padding:10px 12px;border-radius:9px;font-size:.85rem;text-align:left}
.menu button:hover{background:rgba(234,214,173,.12)}
.menu button.danger{color:#f0a9a9}
.menu-note{padding:8px 12px 6px;font-size:.72rem;color:var(--gold);letter-spacing:.02em;border-bottom:1px solid rgba(234,214,173,.15);margin-bottom:4px}
.bk{max-width:1280px;margin:0 auto 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 12px 10px 16px;border-radius:18px;background:linear-gradient(180deg,#fffdf9,var(--paper-2));border:1px solid rgba(111,79,36,.35);color:#4b3715;font-size:.85rem;line-height:1.4;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:rise .3s}
.bk[hidden]{display:none}
.bk span{flex:1 1 240px}
.bk .glass{height:38px}
.bk-x{width:32px;height:32px;border:0;border-radius:50%;background:rgba(111,79,36,.12);color:#4b3715;font-size:1.2rem;line-height:1}
.bk-x:hover{background:rgba(111,79,36,.25)}
.menu hr{border:0;border-top:1px solid rgba(234,214,173,.15);margin:5px 4px}
.menu svg{width:16px;height:16px}

/* scene + book */
.stage{max-width:1280px;margin:0 auto;padding:62px 36px 28px 36px}
.scene{perspective:2000px;perspective-origin:50% 30%}
.book{position:relative;transform-style:preserve-3d;transform:rotateX(2deg);transition:transform .25s ease-out;will-change:transform}
.cover{position:absolute;inset:-16px -18px -20px -34px;border-radius:18px;transform:translateZ(-46px);
  background:linear-gradient(135deg,#2b3150,#151929 60%,#0e111d);
  box-shadow:0 50px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(234,214,173,.12),inset 0 2px 0 rgba(255,255,255,.08)}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(600px 220px at 70% 0%,rgba(201,163,107,.12),transparent 70%)}
.stack{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:var(--paper-2);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.s1{transform:translate3d(5px,6px,-8px);background:#f9f3e7}
.s2{transform:translate3d(10px,12px,-16px);background:#f1e8d6}
.s3{transform:translate3d(15px,18px,-24px);background:#e6dbc4}
.page{position:relative;border-radius:4px 12px 12px 4px;padding:30px clamp(18px,3.2vw,52px) 26px clamp(56px,6vw,88px);
  background:
    radial-gradient(1200px 400px at 50% -10%,rgba(255,255,255,.9),transparent 70%),
    linear-gradient(90deg,rgba(150,120,70,.2),rgba(150,120,70,0) 6%),
    var(--paper);
  box-shadow:0 30px 60px rgba(0,0,0,.45),0 3px 0 rgba(255,255,255,.7) inset,-2px 0 0 rgba(0,0,0,.08) inset;
  min-height:760px}
.page::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.page-inner{position:relative;transform-origin:left center}

/* spiral */
.spiral{position:absolute;left:0;top:26px;bottom:26px;width:0;display:flex;flex-direction:column;justify-content:space-between;transform:translateZ(22px);pointer-events:none;z-index:3}
.ring{position:relative;display:block;width:74px;height:10px;margin-left:-36px;border-radius:6px;
  background:linear-gradient(180deg,#fff 0%,#d9dde4 35%,#8b909c 62%,#e8ebf0 100%);
  box-shadow:0 3px 5px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.6) inset}
.ring::after{content:"";position:absolute;right:14px;top:-1px;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#05060c,#1a1e30);box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 0 0 2px rgba(0,0,0,.08);z-index:-1}

/* abas no topo */
.tabs{position:absolute;left:clamp(40px,6vw,92px);bottom:calc(100% - 1px);display:flex;gap:6px;transform:translateZ(14px);z-index:2}
.tab{position:relative;display:flex;align-items:center;gap:9px;padding:12px 22px 11px;border:0;border-radius:16px 16px 0 0;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#4b3715;
  background:linear-gradient(180deg,var(--gold-l),var(--gold) 70%,#b88d52);box-shadow:0 -4px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.55);
  transform:translateY(7px);filter:saturate(.8) brightness(.92);transition:transform .28s cubic-bezier(.3,1.5,.5,1),filter .2s,padding .2s,background .2s}
.tab:hover{transform:translateY(2px);filter:none}
.tab[aria-selected=true]{transform:translateY(0);filter:none;padding:15px 26px 13px;background:linear-gradient(180deg,#fffdf9,var(--paper));color:var(--gold-dd);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:16%;right:16%;top:0;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l),var(--gold-d))}
.tab .cnt{font-size:.68rem;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;background:var(--navy-1);color:var(--gold-l);letter-spacing:0;padding:0 5px}
.tab[aria-selected=true] .cnt{background:var(--gold);color:#2c1f0c}
.tab .cnt:empty,.tab .cnt[data-n="0"]{display:none}

.app:not([data-tab="agenda"]) .only-agenda{display:none!important}
.cols.lists{grid-template-columns:1fr 1fr;margin-top:12px}
.cols.lists .notes{padding-left:0}
.cols.lists.single{grid-template-columns:1fr}
.entry .val{font-size:.72em;font-weight:700;color:var(--gold-dd);background:rgba(201,163,107,.2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.fin{margin-top:12px}
.fyear{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.fyear .glass{height:36px;width:36px;padding:0;justify-content:center;color:#4a3f33;background:rgba(255,255,255,.55);border:1px solid rgba(160,130,80,.35)}
.fyl{font:600 1.5rem/1 var(--serif);color:var(--gold-dd);min-width:90px;text-align:center}
.ftotal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;margin-bottom:16px;border-radius:18px;background:linear-gradient(180deg,#fff,var(--paper-2));border:1px solid rgba(160,130,80,.35);box-shadow:0 10px 24px -14px rgba(111,79,36,.5),inset 0 1px 0 #fff}
.ftotal small{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.ftotal strong{font:700 2.3rem/1.1 var(--serif);color:var(--gold-dd)}
.ftotal em{font-style:normal;font-size:.8rem;color:#7a6a58}
.fhead,.frow{display:grid;grid-template-columns:130px 150px 1fr 150px;align-items:center;gap:12px}
.fhead{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:700;padding:0 10px 6px}
.fhead span:last-child{text-align:right}
.frow{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(60,50,40,.55);padding:11px 10px;color:#3a3128;cursor:pointer;transition:background .2s;font:inherit}
.frow:hover{background:rgba(201,163,107,.14)}
.frow.now{background:linear-gradient(90deg,rgba(201,163,107,.22),transparent)}
.frow .fm{font:600 1.15rem/1 var(--serif);text-transform:capitalize}
.frow .fn{font-size:.78rem;color:#7a6a58}
.frow .fbar{height:8px;border-radius:99px;background:rgba(160,130,80,.15);overflow:hidden}
.frow .fbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-d));transition:width .5s}
.frow .fv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.frow .fv.zero{color:#a89a88;font-weight:500}
@media(max-width:700px){.fhead{display:none}.frow{grid-template-columns:1fr auto;grid-template-areas:"m v" "n v" "b b";row-gap:4px}.frow .fm{grid-area:m}.frow .fn{grid-area:n}.frow .fv{grid-area:v;font-size:.95rem}.frow .fbar{grid-area:b}.ftotal strong{font-size:1.9rem}}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.pager .glass{height:36px;padding:0 14px}
.pager .glass.icon{padding:0;width:36px;justify-content:center}
.pager .pgl{font:600 14px/1 var(--ui);color:#4a3f33;min-width:110px;text-align:center}
.pager .glass{color:#4a3f33;background:rgba(255,255,255,.55);border:1px solid rgba(160,130,80,.35)}
.pager button[disabled]{opacity:.35;pointer-events:none}
.pager .danger{color:#a4412f}

/* page header */
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.month{position:relative;isolation:isolate;display:inline-block;font:400 clamp(2.6rem,5vw,4.2rem)/1.15 var(--script);padding-right:10px;
  background:linear-gradient(110deg,#b3843f 0%,#ecd8ae 35%,#c9a36b 55%,#a67c44 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s ease-in-out infinite}
.month::after{content:attr(data-text);position:absolute;left:3px;top:3px;z-index:-1;color:transparent;background:none;
  -webkit-text-stroke:.7px rgba(27,27,34,.6)}
@keyframes shimmer{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.eyebrow{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-d);margin:-2px 0 0 4px;font-weight:600}
.leafdeco{width:46px;height:46px;color:var(--gold-d);opacity:.85;animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}

/* days */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 clamp(22px,3vw,44px);margin-top:12px}
.cols.one{grid-template-columns:1fr 1fr}
.day-head{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;margin-bottom:12px}
.cols.hasblk .day-head{min-height:98px}
.badge{display:grid;place-items:center;min-width:42px;height:38px;padding:0 8px;font-family:var(--serif);font-weight:600;font-style:normal;font-size:1.15rem;
  border-radius:12px 3px 12px 3px;color:var(--ink);background:linear-gradient(145deg,#f0e8d6,var(--beige) 60%,var(--beige-d));
  box-shadow:0 4px 0 var(--beige-d),0 8px 12px rgba(80,60,20,.25),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .3s}
.day:hover .badge{transform:translateY(-3px) rotateX(12deg) rotateZ(-3deg)}
.today .badge{background:linear-gradient(145deg,var(--gold-l),var(--gold) 55%,var(--gold-d));color:#3d2c12;box-shadow:0 4px 0 var(--gold-dd),0 10px 18px rgba(154,114,64,.5),inset 0 1px 0 rgba(255,255,255,.7);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--gold-dd),0 10px 26px rgba(201,163,107,.9),inset 0 1px 0 rgba(255,255,255,.7)}}
.wd{font-family:var(--hand);font-weight:600;font-size:1.25rem;color:var(--ink)}
.row{display:flex;align-items:flex-end;min-height:38px}
.row .h{flex:0 0 46px;font-family:var(--hand);font-weight:700;font-size:1.2rem;line-height:1;padding-bottom:5px;color:var(--ink)}
.row .cell{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-end;gap:4px;min-height:38px;padding:3px 4px 3px;border-bottom:1.6px solid var(--ink);cursor:cell;transition:background .15s;position:relative}
.row .cell:hover{background:linear-gradient(0deg,rgba(201,163,107,.2),transparent 80%)}
.row .cell:empty::after{content:"+";position:absolute;right:6px;bottom:4px;color:var(--gold-d);font-weight:700;opacity:0;transition:opacity .15s}
.row .cell:empty:hover::after{opacity:.8}

/* entries */
.entry{position:relative;display:inline-block;max-width:100%;padding:3px 26px 3px 7px;border-radius:9px;cursor:pointer;vertical-align:bottom;
  font-family:var(--note);font-size:1.22rem;line-height:1.15;
  background:linear-gradient(180deg,rgba(234,214,173,.55),rgba(201,163,107,.28));
  box-shadow:0 2px 0 rgba(154,114,64,.45),0 5px 8px rgba(100,70,20,.18);transition:transform .15s,box-shadow .15s}
.entry:hover{transform:translateY(-2px) translateZ(0);box-shadow:0 4px 0 rgba(154,114,64,.45),0 10px 14px rgba(100,70,20,.25)}
.entry:focus-visible{outline:2px solid var(--gold-d);outline-offset:2px}
.entry.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.entry .chk{display:inline-block;vertical-align:-2px;margin-right:6px;width:15px;height:15px;border-radius:50%;border:1.6px solid var(--gold-dd);background:#fff8;padding:0;position:relative}
.entry.done .chk{background:var(--gold-d)}
.entry.done .chk::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}
.entry .t{font-family:var(--ui);font-size:.66rem;font-weight:700;color:var(--gold-dd);letter-spacing:.03em;margin-right:6px}
.entry .cli{font-weight:700;color:var(--gold-dd);overflow-wrap:anywhere}
.entry .d{color:#2f2d34;overflow-wrap:anywhere}
.entry .sep{color:var(--gold-dd);font-weight:700}
.entry.done .cli,.entry.done .d{text-decoration:line-through;opacity:.5}
.entry.late{box-shadow:0 2px 0 rgba(162,74,74,.6),0 5px 8px rgba(162,74,74,.2)}
.entry.late::before{content:"";position:absolute;left:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--wine);box-shadow:0 0 0 2px var(--paper)}
.entry .del{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:19px;height:19px;border:0;border-radius:50%;background:transparent;color:var(--gold-dd);font-size:1.05rem;line-height:1;display:grid;place-items:center;opacity:.45;transition:all .15s}
.entry:hover .del,.entry:focus-within .del{opacity:1}
.entry .del:hover{background:var(--wine);color:#fff}

/* bloqueios (sem atendimento) */
.cell.blocked{cursor:pointer;border-bottom-color:rgba(162,74,74,.5);
  background:repeating-linear-gradient(135deg,rgba(162,74,74,.085) 0 5px,rgba(162,74,74,.025) 5px 10px);
  box-shadow:inset 3px 0 0 rgba(162,74,74,.55);transition:background .2s}
.cell.blocked::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:1.5px;transform:translateY(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(162,74,74,.75) 10%,rgba(162,74,74,.75) 90%,transparent)}
.cell.blocked:hover{background:repeating-linear-gradient(135deg,rgba(162,74,74,.17) 0 5px,rgba(162,74,74,.05) 5px 10px)}
.cell.blocked .entry{z-index:1}
.row .cell.blocked:empty::after{display:none}
.row.brow .h{opacity:.4;text-decoration:line-through;text-decoration-color:rgba(162,74,74,.8)}
.blk{position:relative;z-index:1;align-self:center;margin:0 auto;display:inline-flex;gap:6px;align-items:center;padding:3px 14px;border-radius:999px;background:linear-gradient(180deg,#fff,#f8ebeb);color:var(--wine);font-family:var(--ui);font-size:.62rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;box-shadow:0 0 0 1.5px rgba(162,74,74,.45),0 4px 10px rgba(162,74,74,.2)}
.blk svg,.dayblk svg{width:11px;height:11px}
.dayblk{display:inline-flex;gap:5px;align-items:center;border:0;margin-top:3px;padding:3px 12px;border-radius:999px;background:linear-gradient(180deg,#fff,#f8ebeb);color:var(--wine);font-family:var(--ui);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 0 1.5px rgba(162,74,74,.4),0 4px 10px rgba(162,74,74,.18);transition:all .18s}
.dayblk:hover{background:var(--wine);color:#fff;transform:translateY(-1px)}
.dayblocked .wd{text-decoration:line-through;text-decoration-thickness:2px}
.dayblocked .badge{opacity:.65}

/* notes page */
.notes{padding-left:6px}
.notes-title{position:relative;isolation:isolate;display:block;text-align:center;font:400 clamp(2rem,3.4vw,2.8rem)/1.2 var(--script);margin:2px 0 14px;
  background:linear-gradient(110deg,#b3843f,#ecd8ae 40%,#c9a36b 60%,#a67c44);-webkit-background-clip:text;background-clip:text;color:transparent}
.notes-title::after{content:attr(data-text);position:absolute;left:0;right:0;top:3px;left:3px;z-index:-1;color:transparent;-webkit-text-stroke:.7px rgba(27,27,34,.6)}
.nline{display:block;width:100%;height:38px;border:0;border-bottom:1.6px solid var(--ink);background:transparent;font-family:var(--note);font-size:1.25rem;padding:6px 4px 2px;border-radius:0;outline:0;transition:background .15s}
.nline:focus{background:linear-gradient(0deg,rgba(201,163,107,.22),transparent 85%)}

/* footer */
.pf{display:flex;justify-content:flex-end;margin-top:22px}
.logo{display:flex;align-items:center;gap:8px;text-align:center;color:var(--ink)}
.logo svg{width:30px;height:30px;color:var(--gold-d)}
.logo b{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.15rem;line-height:1}
.logo small{display:block;font-size:.5rem;letter-spacing:.3em;margin-top:3px;color:var(--ink-2)}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(8,10,20,.72);backdrop-filter:blur(6px);animation:fade .2s}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.sheet{width:min(480px,100%);max-height:94vh;overflow:auto;padding:24px 26px 22px;border-radius:18px;background:linear-gradient(180deg,var(--paper),var(--paper-2));
  box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 1px rgba(201,163,107,.45),inset 0 2px 0 #fff;animation:flipin .45s cubic-bezier(.2,1.2,.4,1);transform-origin:50% 100%}
@keyframes flipin{from{opacity:0;transform:perspective(900px) rotateX(-35deg) translateY(30px) scale(.94)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{font:400 2.3rem/1 var(--script);color:var(--gold-d)}
.x{border:0;background:#fff;width:36px;height:36px;border-radius:50%;font-size:1.3rem;line-height:1;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--beige-d);transition:all .18s}
.x:hover{background:var(--gold-l);transform:rotate(90deg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:10px 6px;border-radius:999px;background:#fff;color:var(--ink-2);font-size:.76rem;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--beige-d);transition:all .18s;cursor:pointer}
.seg span:hover{box-shadow:inset 0 0 0 1.5px var(--gold)}
.seg input:checked+span{background:linear-gradient(135deg,var(--gold-l),var(--gold) 60%,#b88d52);color:#2c1f0c;box-shadow:0 6px 16px rgba(201,163,107,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.seg.seg2{grid-template-columns:1fr 1fr}
.seg[hidden]{display:none}
.two.t2{grid-template-columns:1.6fr 1fr}
.chk-line{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--beige-d);cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink-2);margin-bottom:10px;transition:box-shadow .15s}
.chk-line:hover{box-shadow:inset 0 0 0 1.5px var(--gold)}
.chk-line input{width:20px;height:20px;accent-color:var(--gold-d);flex:0 0 auto}
.nextbox{margin-bottom:6px}
.nextbox[hidden]{display:none}
.nextbox .hint{margin:-4px 0 12px}
.cflist{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.cflist li{padding:9px 12px;border-radius:12px;background:#fbeeee;box-shadow:inset 0 0 0 1.5px #ecc3c3;font-size:.86rem;color:var(--ink);line-height:1.4}
.bad{color:var(--wine);font-weight:700}
.ok{color:#5b7a4c;font-weight:700}
.cell.busy{background:linear-gradient(90deg,rgba(201,163,107,.2),rgba(201,163,107,.05));box-shadow:inset 3px 0 0 rgba(201,163,107,.85)}
.cell.busy.blocked{background:repeating-linear-gradient(135deg,rgba(162,74,74,.085) 0 5px,rgba(162,74,74,.025) 5px 10px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two[hidden]{display:none}
.hint{font-size:.76rem;color:var(--ink-2);margin:2px 0 14px;line-height:1.45}
.seg input:focus-visible+span{outline:2px solid var(--gold-d);outline-offset:2px}
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--beige-d);background:#fff;outline:0;font-size:.95rem;box-shadow:inset 0 2px 4px rgba(120,90,40,.1);transition:border .15s,box-shadow .15s}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,163,107,.3)}
.field.err input{border-color:var(--wine);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.actions{display:flex;gap:10px;align-items:center;margin-top:6px}
.actions .sp{flex:1}
.btn{height:44px;padding:0 22px;border-radius:999px;border:0;font-weight:600;font-size:.88rem;transition:transform .18s,box-shadow .18s,filter .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--beige-d)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.danger{background:#fbe9e9;color:var(--wine);box-shadow:inset 0 0 0 1.5px #ecc3c3}
.btn.danger:hover{background:#f6d7d7}
.btn.gold{background:linear-gradient(135deg,var(--gold-l),var(--gold) 55%,#b88d52);color:#2c1f0c;font-weight:700;box-shadow:0 8px 20px rgba(201,163,107,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.gold:hover{box-shadow:0 12px 26px rgba(201,163,107,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.confirm p{color:var(--ink-2);font-size:.93rem;line-height:1.5;margin-bottom:18px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:13px;background:var(--navy-1);color:var(--gold-l);font-size:.86rem;border:1px solid rgba(234,214,173,.35);box-shadow:0 14px 30px rgba(0,0,0,.5);animation:rise .25s}
.toast button{border:0;background:none;color:var(--gold);font-weight:700;text-decoration:underline}
.warn{max-width:1280px;margin:0 auto 10px;padding:10px 14px;border-radius:12px;background:#4a2a2a;color:#ffd6d6;font-size:.82rem}

/* responsive */
@media (max-width:900px){
  .cols{gap:0 18px}
  .row .h{flex-basis:38px;font-size:1.05rem}
  .entry{font-size:1.08rem}
  .stage{padding:58px 10px 24px 22px}
  .tabs{left:34px}
  .tab{padding:10px 14px 9px;font-size:.7rem;letter-spacing:.05em}
  .tab[aria-selected=true]{padding:12px 16px 11px}
  .page{padding-left:56px;min-height:0}
  .cover{inset:-12px -10px -14px -20px}
}
button{touch-action:manipulation}
.app{padding-top:calc(18px + env(safe-area-inset-top));padding-left:calc(clamp(12px,3vw,40px) + env(safe-area-inset-left));padding-right:calc(clamp(12px,3vw,40px) + env(safe-area-inset-right));padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.cols.one{grid-template-columns:minmax(0,640px);justify-content:center}
@media (hover:none){.entry .del{opacity:1}}
@keyframes sheetup{from{transform:translateY(100%)}}
@media (max-width:700px){
  body{background-attachment:scroll}
  .app{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  .top{gap:10px;margin-bottom:8px}
  .brand{width:100%}
  .brand .mark{width:52px;height:52px;border-radius:14px}
  .brand h1{font-size:1.25rem}
  .controls{width:100%;gap:8px}
  .glass{height:40px;padding:0 14px}
  .glass.icon{width:40px}
  input.glass{flex:1 1 130px;min-width:0;font-size:16px}
  .segmented button{padding:7px 12px}
  #add{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;width:60px;height:60px;padding:0;justify-content:center;border-radius:50%}
  #add span{display:none}
  #add svg{width:26px;height:26px}
  .toasts{bottom:calc(92px + env(safe-area-inset-bottom))}
  .stage{padding:52px 4px 20px 16px}
  .tabs{left:26px;right:6px;gap:4px}
  .tab{flex:1 1 0;min-width:0;overflow:hidden;justify-content:center;padding:9px 3px 8px;font-size:.58rem;letter-spacing:.01em;border-radius:12px 12px 0 0;gap:3px}
  .tab[aria-selected=true]{padding:11px 3px 9px}
  .tab .cnt{position:absolute;top:2px;right:3px;min-width:15px;height:15px;font-size:.52rem;padding:0 3px}
  .page{padding:20px 14px 20px 40px;border-radius:4px 10px 10px 4px}
  .cover{inset:-10px -8px -12px -16px}
  .ring{width:50px;margin-left:-24px;height:8px}
  .ring::after{right:10px;width:10px;height:10px}
  .month{font-size:2.4rem}
  .leafdeco{width:34px;height:34px}
  .cols:not(.lists):not(.one){display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:18px;margin-right:-14px;padding-right:14px;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .cols:not(.lists):not(.one)::-webkit-scrollbar{display:none}
  .cols:not(.lists):not(.one) .day{flex:0 0 84%;scroll-snap-align:start;min-width:0}
  .cols.one,.cols.lists{grid-template-columns:1fr}
  .row,.row .cell{min-height:42px}
  .nline{height:42px;font-size:1.3rem}
  .pf{margin-top:14px}
  .logo svg{width:24px;height:24px}
  .overlay{align-items:end;padding:0}
  .sheet{width:100%;border-radius:22px 22px 0 0;max-height:92dvh;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:sheetup .35s cubic-bezier(.2,1,.3,1)}
  .field input,.field textarea,.field select{font-size:16px}
  .two{gap:10px}
  .two.t2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.book{transform:none!important}}
@media print{.top,.tabs,.amb,.spiral,.cover,.stack{display:none}body{background:#fff}.page{box-shadow:none}}
</style>

<div class="overlay" id="bmodal" hidden>

      <label class="field"><span>De</span><input id="bFrom" type="date"></label>
      <label class="field"><span>Até</span><input id="bTo" type="date"></label>

const toMin=dt=>parseInt(dt.slice(11,13),10)*60+parseInt(dt.slice(14,16),10);

function blockFor(dt,dur){const ds=dt.slice(0,10),a=toMin(dt),b=a+(dur||60);return state.blocks.find(x=>x.from<=ds&&ds<=x.to&&(x.allDay||(a<x.h2*60&&b>x.h1*60)))||null}

  return state.entries.filter(e=>e.tab==='agenda'&&e.id!==ignoreId&&e.dt.slice(0,10)===ds&&a<toMin(e.dt)+(e.dur||60)&&toMin(e.dt)<b);

function nextFree(dt,dur,ignoreId){

let busy=false,queued=null;
async function turn(change,dir){
  if(busy){queued=[change,dir];return}
  if(reduced){change();render();return}
  busy=true;
  const el=$('#pageInner');
  const ang=dir>0?-82:82;
  try{
    const out=el.animate([{transform:'perspective(1800px) rotateY(0)',opacity:1},{transform:'perspective(1800px) rotateY('+ang+'deg)',opacity:.1}],{duration:240,easing:'ease-in',fill:'forwards'});
    await out.finished;
    change();render();
    out.cancel();
    await $('#pageInner').animate([{transform:'perspective(1800px) rotateY('+(-ang)+'deg)',opacity:.1},{transform:'perspective(1800px) rotateY(0)',opacity:1}],{duration:340,easing:'cubic-bezier(.2,.9,.3,1)'}).finished;
  }catch(e){change();render();}

  const cliente=$('#fCli').value.trim(),dt=$('#fDt').value,desc=$('#fDesc').value.trim(),valor=parseVal($('#fVal').value);
  let dur=+$('#fDur').value||60;
  if(!cliente){const w=$('#fCliWrap');w.classList.remove('err');void w.offsetWidth;w.classList.add('err');$('#fCli').focus();return}
  if(!dt){$('#fDt').focus();return}
  if(dt&&toMin(dt)+dur>1440)dur=Math.max(15,1440-toMin(dt));
  const c0=conflictsFor(dt,dur,editingId);
  if(c0.length){
    const free=nextFree(dt,dur,editingId);
    const btns=[{label:'Voltar',value:'back'}];if(free)btns.push({label:'Usar '+free.slice(11,16),cls:'gold',value:'use'});
    const r=await dialog('Horário já reservado',conflictHtml([{dt,list:c0}],'Esse horário se sobrepõe a outro agendamento:'),btns);
    if(r==='use'){$('#fDt').value=free;updateNext()}
    return;
  }
  if(dtBlocked(dt,dur)&&!await ask('Horário bloqueado','Esse horário está marcado como sem atendimento. Agendar mesmo assim?','Agendar'))return;
  const ok=[dt],skipped=[];
  nextTargets().forEach(t=>{
    const c=conflictsFor(t,dur);
    if(c.length)skipped.push({dt:t,list:c});
    else{const bl=blockFor(t,dur);if(bl)skipped.push({dt:t,blocked:bl});else ok.push(t)}
  });
  if(skipped.length){
    const only=ok.length===1;
    const r=await dialog('Retornos com conflito',conflictHtml(skipped,'Estes retornos não podem ser marcados:'),[{label:'Voltar',value:'back'},{label:only?'Salvar sem retornos':'Marcar só os livres',cls:'gold',value:'go'}]);
    if(r!=='go')return;
  }
  let first;const editingWas=!!editingId;
  if(editingId){first=state.entries.find(e=>e.id===editingId);Object.assign(first,{tab:'agenda',cliente,dt,desc,dur,valor});ok.slice(1).forEach(t=>state.entries.push({id:uid(),tab:'agenda',cliente,dt:t,desc,dur,valor,done:false}))}
  else ok.forEach((t,i)=>{const r={id:uid(),tab:'agenda',cliente,dt:t,desc,dur,valor,done:false};state.entries.push(r);if(!i)first=r});
  justAdded=first.id;
  const ds=dt.slice(0,10);
  state.ui.tab='agenda';
  const start=parseYmd(state.ui.start),n=step();
  if(ds<state.ui.start||ds>ymd(addDays(start,n-1)))state.ui.start=ds;
  save();closeModal();
  render();justAdded=null;
  toast(editingWas?(ok.length>1?ok.length-1+(ok.length===2?' retorno agendado':' retornos agendados'):'Entrada salva'):(ok.length>1?ok.length+' agendamentos salvos':'Entrada salva'));
});
$('#fDel').onclick=()=>{const id=editingId;closeModal();delEntry(id)};

function delEntry(id){
  const i=state.entries.findIndex(e=>e.id===id);if(i<0)return;
  const [r]=state.entries.splice(i,1);
  save();render();
  toast('Entrada excluída',{label:'Desfazer',fn:()=>{state.entries.push(r);save();render()}});
}
function toggleEntry(id){const e=state.entries.find(x=>x.id===id);if(!e)return;e.done=!e.done;save();render()}

$('#page').addEventListener('click',e=>{
  const act=e.target.closest('[data-act]'),ent=e.target.closest('.entry');
  if(act&&ent){act.dataset.act==='del'?delEntry(ent.dataset.id):toggleEntry(ent.dataset.id);return}
  if(ent){openModal(state.entries.find(x=>x.id===ent.dataset.id));return}
  const bk=e.target.closest('.dayblk,.cell.blocked');
  if(bk){openBlock(state.blocks.find(b=>b.id===bk.dataset.block));return}
  const cell=e.target.closest('.cell');
  if(cell)openModal(null,dtVal(cell.dataset.date,+cell.dataset.hour));
});
$('#page').addEventListener('keydown',e=>{
  const ent=e.target.closest&&e.target.closest('.entry');
  if(ent&&e.target===ent&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openModal(state.entries.find(x=>x.id===ent.dataset.id))}
});
$('#page').addEventListener('input',e=>{
  const t=e.target;if(!t.classList.contains('nline'))return;
  const key=t.dataset.key,tab=key.split('|')[0],arr=state.notes[key]||(state.notes[key]=[]);
  const idx=+t.dataset.i;arr[idx]=t.value;
  while(arr.length&&!arr[arr.length-1])arr.pop();
  if(!arr.length)delete state.notes[key];
  const per=PER(tab),pg=curPage(tab);
  if(t.value&&pg===pageCount(tab)-1&&idx>=pg*per+per-2){
    state.notes[tab+'|paginas']=pageCount(tab)+1;
    const pr=$('#page .pager');if(pr)pr.outerHTML=pagerHtml(tab);
    toast('Nova página criada');
  }
  save();
  const c=document.querySelector('.tab[data-tab="'+tab+'"] .cnt');if(c){const n=noteLines(tab).filter(Boolean).length;c.dataset.n=n;c.textContent=n||''}
});
function goPage(tab,to,dir){turn(()=>{npage[tab]=to},dir)}
$('#page').addEventListener('click',e=>{
  const fy=e.target.closest('[data-fy]');
  if(fy){const d=+fy.dataset.fy;turn(()=>{finYear+=d},d);return}
  const fm=e.target.closest('[data-fm]');
  if(fm){const m=+fm.dataset.fm;turn(()=>{state.ui.tab='agenda';state.ui.start=finYear+'-'+pad(m+1)+'-01';save()},-1)}
});
$('#page').addEventListener('click',async e=>{
  const b=e.target.closest('[data-pg]');if(!b||b.disabled)return;
  const tab=state.ui.tab,pg=curPage(tab),n=pageCount(tab),a=b.dataset.pg;
  if(a==='prev')goPage(tab,pg-1,-1);
  else if(a==='next')goPage(tab,pg+1,1);
  else if(a==='add'){turn(()=>{state.notes[tab+'|paginas']=n+1;npage[tab]=n;save()},1)}
  else if(a==='del'){
    const per=PER(tab),has=noteLines(tab).slice(pg*per,pg*per+per).some(Boolean);
    if(has&&!await ask('Excluir página '+(pg+1),'As anotações desta página serão apagadas. Não dá para desfazer.','Excluir'))return;
    turn(()=>{
      const arr=noteLines(tab);arr.splice(pg*per,per);
      while(arr.length&&!arr[arr.length-1])arr.pop();
      if(arr.length)state.notes[tab+'|lista']=arr;else delete state.notes[tab+'|lista'];
      const m=Math.max(1,n-1);if(m>1)state.notes[tab+'|paginas']=m;else delete state.notes[tab+'|paginas'];
      npage[tab]=Math.max(0,pg-1);save();
    },-1);
  }
});

/* ---------- bloqueios ---------- */
const bmodal=$('#bmodal'),bform=$('#bform');
let editingBlock=null;
$('#bH1').innerHTML=HOURS.map(h=>'<option value="'+h+'">'+pad(h)+'h</option>').join('');
$('#bH2').innerHTML=[...HOURS.slice(1),24].map(h=>'<option value="'+h+'">'+pad(h)+'h</option>').join('');
const bType=()=>bform.querySelector('input[name=bType]:checked').value;
const syncB=()=>{$('#bHours').hidden=bType()!=='hours'};
bform.addEventListener('change',e=>{if(e.target.name==='bType')syncB()});
function syncDates(){const f=$('#bFrom').value,t=$('#bTo');t.min=f||'';if(f&&(!t.value||t.value<f))t.value=f}
function syncHours(){const h1=+$('#bH1').value,sel=$('#bH2');[...sel.options].forEach(o=>o.disabled=+o.value<=h1);if(+sel.value<=h1)sel.value=Math.min(24,h1+1)}
['input','change'].forEach(ev=>{$('#bFrom').addEventListener(ev,syncDates);$('#bTo').addEventListener(ev,syncDates)});
$('#bH1').addEventListener('change',syncHours);$('#bH2').addEventListener('change',syncHours);
function openBlock(b){
  editingBlock=b?b.id:null;
  $('#bTitle').textContent=b?'Editar bloqueio':'Bloquear agenda';
  const start=parseYmd(state.ui.start),vis=[...Array(step())].map((_,i)=>ymd(addDays(start,i)));
  const def=vis.includes(ymd(new Date()))?ymd(new Date()):vis[0];
  $('#bFrom').value=b?b.from:def;$('#bTo').value=b?b.to:def;
  bform.querySelectorAll('input[name=bType]').forEach(r=>r.checked=r.value===(b&&!b.allDay?'hours':'day'));
  $('#bH1').value=b&&!b.allDay?b.h1:12;$('#bH2').value=b&&!b.allDay?b.h2:14;
  $('#bMotivo').value=b?b.motivo:'';
  $('#bDel').hidden=!b;syncB();syncDates();syncHours();
  bmodal.hidden=false;
  setTimeout(()=>$('#bFrom').focus(),60);
}
const closeBlock=()=>{bmodal.hidden=true;editingBlock=null};
bmodal.addEventListener('click',e=>{if(e.target===bmodal||e.target.closest('[data-bclose]'))closeBlock()});
$('#blockBtn').onclick=()=>openBlock(null);
bform.addEventListener('submit',ev=>{
  ev.preventDefault();
  const from=$('#bFrom').value,to=$('#bTo').value||from,allDay=bType()==='day';
  const h1=+$('#bH1').value,h2=+$('#bH2').value;
  if(!from){$('#bFrom').focus();return}
  if(to<from){toast('A data final precisa ser depois da inicial');return}
  if(!allDay&&h2<=h1){toast('A hora final precisa ser depois da inicial');return}
  const motivo=$('#bMotivo').value.trim();
  const data={from,to,allDay,h1,h2,motivo};
  if(editingBlock)Object.assign(state.blocks.find(b=>b.id===editingBlock),data);
  else state.blocks.push(Object.assign({id:uid()},data));
  state.ui.tab='agenda';
  const start=parseYmd(state.ui.start),n=step();
  if(from>ymd(addDays(start,n-1))||to<state.ui.start)state.ui.start=from;
  save();closeBlock();render();toast('Bloqueio salvo');
});
$('#bDel').onclick=()=>{
  const i=state.blocks.findIndex(b=>b.id===editingBlock);if(i<0)return;
  const [r]=state.blocks.splice(i,1);closeBlock();save();render();
  toast('Bloqueio removido',{label:'Desfazer',fn:()=>{state.blocks.push(r);save();render()}});
};

/* ---------- menu, backup, limpar ---------- */
const menu=$('#menu');
$('#menuBtn').onclick=e=>{e.stopPropagation();updateBackupUI();menu.hidden=!menu.hidden};
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))menu.hidden=true});
const hasData=()=>state.entries.length>0||state.blocks.length>0||Object.keys(state.notes).length>0;
const daysAgo=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<=0?'hoje':d===1?'há 1 dia':'há '+d+' dias'};
let bkDismissed=false;
function updateBackupUI(){
  const note=$('#bkNote');
  note.textContent=meta.lastBackup?'Último backup: '+daysAgo(meta.lastBackup):'Nenhum backup feito ainda';
  const bk=$('#bk'),txt=$('#bkTxt'),act=$('#bkAct');
  let show=false;
  if(!hasData()){
    txt.textContent='Agenda vazia. Se você já usava e os dados sumiram, restaure seu backup mais recente.';
    act.textContent='Importar backup';act.onclick=()=>$('#file').click();show=true;
  }else if(meta.dirtyAt&&Date.now()-meta.dirtyAt>=(meta.lastBackup?3:1)*864e5){
    txt.textContent=(meta.lastBackup?'Seu último backup foi '+daysAgo(meta.lastBackup)+'.':'Você ainda não fez backup.')+' Salve uma cópia no iCloud Drive ou Arquivos para não perder seus agendamentos.';
    act.textContent='Salvar backup agora';act.onclick=backup;show=true;
  }
  bk.hidden=!show||bkDismissed;
}
$('#bkX').onclick=()=>{bkDismissed=true;$('#bk').hidden=true};
async function backup(){
  menu.hidden=true;
  const json=JSON.stringify({versao:2,exportado:new Date().toISOString(),entries:state.entries,notes:state.notes,blocks:state.blocks},null,2);
  const name='agenda-elienai-backup-'+ymd(new Date())+'.json';
  let done=false;
  try{
    const file=new File([json],name,{type:'application/json'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Backup da agenda'});done=true;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  if(!done){
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
  meta.lastBackup=Date.now();meta.dirtyAt=null;saveMeta();updateBackupUI();
  toast('Backup salvo');
}
$('#mExport').onclick=backup;
$('#mImport').onclick=()=>{menu.hidden=true;$('#file').click()};
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const o=JSON.parse(await f.text());
    if(!o||!Array.isArray(o.entries))throw 0;
    if(!await ask('Importar backup','Isso substitui todos os dados atuais pelos do arquivo. Continuar?','Importar'))return;
    const n=normalize({entries:o.entries,notes:o.notes,blocks:o.blocks,ui:state.ui});
    state.entries=n.entries;state.notes=n.notes;state.blocks=n.blocks;save();meta.dirtyAt=null;saveMeta();render();toast('Backup importado');
  }catch(err){toast('Arquivo de backup inválido')}
};
$('#mClearTab').onclick=async()=>{
  menu.hidden=true;
  if(state.ui.tab==='financeiro'){toast('Os valores vêm dos agendamentos');return}const lb=TABS.find(t=>t.id===state.ui.tab).label;
  if(!await ask('Apagar aba "'+lb+'"','Todas as entradas desta aba serão excluídas. Não dá para desfazer.','Apagar'))return;
  state.entries=state.entries.filter(e=>e.tab!==state.ui.tab);
  if(state.ui.tab==='agenda')state.blocks=[];
  Object.keys(state.notes).forEach(k=>{if(k.startsWith(state.ui.tab+'|'))delete state.notes[k]});
  save();render();toast('Aba limpa');
};
$('#mClearAll').onclick=async()=>{
  menu.hidden=true;
  if(!await ask('Apagar tudo','Todas as entradas e anotações de todas as abas serão excluídas. Não dá para desfazer.','Apagar tudo'))return;
  state.entries=[];state.notes={};state.blocks=[];save();render();toast('Agenda limpa');
};
function ask(title,msg,ok){
  return new Promise(res=>{
    const c=$('#confirm');$('#cTitle').textContent=title;$('#cMsg').textContent=msg;$('#cYes').textContent=ok||'Confirmar';c.hidden=false;
    const done=v=>{c.hidden=true;$('#cYes').onclick=$('#cNo').onclick=null;res(v)};
    $('#cYes').onclick=()=>done(true);$('#cNo').onclick=()=>done(false);
    c.onclick=e=>{if(e.target===c)done(false)};
    $('#cNo').focus();
  });
}

/* ---------- toasts ---------- */
function toast(msg,action){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<span>'+esc(msg)+'</span>';
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();t.remove()};t.appendChild(b)}
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(),action?6000:2400);
}

/* ---------- teclado ---------- */
document.addEventListener('keydown',e=>{
  if(!$('#dlg').hidden){if(e.key==='Escape'){$('#dlg').hidden=true;if(dlgRes){const r=dlgRes;dlgRes=null;r('back')}}return}
  if(!$('#confirm').hidden){if(e.key==='Escape')$('#cNo').click();return}
  if(!bmodal.hidden){if(e.key==='Escape')closeBlock();return}
  if(!modal.hidden){if(e.key==='Escape')closeModal();return}
  if(e.target.matches('input,textarea,select'))return;
  const ag=state.ui.tab==='agenda';
  if(/^[1-5]$/.test(e.key)){const t=TABS[+e.key-1];if(t.id!==state.ui.tab)turn(()=>{state.ui.tab=t.id;save()},+e.key-1>TABS.findIndex(x=>x.id===state.ui.tab)?1:-1)}
  else if(e.key==='ArrowLeft')$('#prev').click();
  else if(e.key==='ArrowRight')$('#next').click();
  else if(!ag)return;
  else if(e.key==='n'||e.key==='N'){e.preventDefault();openModal(null)}
  else if(e.key==='t'||e.key==='T')$('#today').click();
  else if(e.key==='b'||e.key==='B'){e.preventDefault();openBlock(null)}
});

/* ---------- inclinação 3D do caderno ---------- */
if(!reduced&&matchMedia('(hover:hover) and (min-width:901px)').matches){
  const book=$('#book'),scene=$('#scene');
  scene.addEventListener('mousemove',e=>{
    if(!modal.hidden)return;
    const r=scene.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5,y=Math.min(1,Math.max(0,(e.clientY-r.top)/Math.max(r.height,1)))-.5;
    book.style.transform='rotateX('+(2-y*3)+'deg) rotateY('+(x*4.5)+'deg)';
  });
  scene.addEventListener('mouseleave',()=>{book.style.transform='rotateX(2deg)'});
}

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(hasData()&&!meta.lastBackup&&!meta.dirtyAt){meta.dirtyAt=Date.now();saveMeta()}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();
save(true);
})();
</script>
</body>
</html>
